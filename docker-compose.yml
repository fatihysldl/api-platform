services:
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8080:8080"
    environment:
      CONFIG_URL: /config/swagger-config.json
    volumes:
      - ./swagger:/usr/share/nginx/html/config:ro
      - ./openapi:/usr/share/nginx/html/specs/internal:ro
      - ./zoho/crm/v8.0:/usr/share/nginx/html/specs/zoho:ro

