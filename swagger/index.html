<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CFX API Portal</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/swagger-ui-dist/swagger-ui.css"
  >

  <style>
    body {
      margin: 0;
      background: #fafafa;
    }

    /* Hide the default Swagger branding */
    .swagger-ui .topbar .link {
      display: none;
    }

    /* Keep the top bar content vertically aligned */
    .swagger-ui .topbar .topbar-wrapper {
      display: flex;
      align-items: center;
    }

    /* Cloudyflex logo */
    .cfx-logo {
      height: 42px;
      width: auto;
      object-fit: contain;
    }

    /* Keep API selector on the right */
    .swagger-ui .topbar .download-url-wrapper {
      margin-left: auto;
    }
  </style>
</head>

<body>

<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>

<script>
  window.onload = async function () {

    const response = await fetch('./swagger-config.json');
    const config = await response.json();

    SwaggerUIBundle({
      ...config,

      dom_id: '#swagger-ui',

      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset
      ],

      layout: 'StandaloneLayout',

      onComplete: function () {
        const topbarWrapper = document.querySelector(
          '.swagger-ui .topbar .topbar-wrapper'
        );

        if (topbarWrapper && !document.querySelector('.cfx-logo')) {
          const logo = document.createElement('img');

          logo.src = './cloudyflex-logo.png';
          logo.alt = 'Cloudyflex';
          logo.className = 'cfx-logo';

          topbarWrapper.prepend(logo);
        }
      }
    });
  };
</script>

</body>
</html>
