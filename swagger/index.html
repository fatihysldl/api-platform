<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CFX API Portal</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/swagger-ui-dist/swagger-ui.css"
  >

  <style>
    body {
      margin: 0;
      background: #fafafa;
    }

    .swagger-ui .topbar .link {
      display: none;
    }

    .swagger-ui .topbar {
      padding: 8px 0;
    }

    .swagger-ui .topbar .topbar-wrapper {
      display: flex;
      align-items: center;
      max-width: none;
      padding: 0 28px;
    }

    .cfx-brand {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 320px;
    }

    .cfx-logo {
      width: 180px;
      height: 52px;
      object-fit: contain;
      object-position: left center;
    }

    .cfx-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      font-family: Arial, Helvetica, sans-serif;
    }

    .swagger-ui .topbar .download-url-wrapper {
      margin-left: auto;
      max-width: 760px;
      flex: 1;
    }

    .swagger-ui .topbar .download-url-wrapper label {
      color: #ffffff;
    }

    @media (max-width: 900px) {
      .swagger-ui .topbar .topbar-wrapper {
        flex-wrap: wrap;
        gap: 12px;
      }

      .cfx-brand {
        width: 100%;
      }

      .swagger-ui .topbar .download-url-wrapper {
        width: 100%;
        max-width: none;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>

<script>
  window.onload = async function () {

    const response = await fetch('./swagger-config.json');
    const config = await response.json();

    SwaggerUIBundle({
      ...config,

      dom_id: '#swagger-ui',

      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset
      ],

      layout: 'StandaloneLayout',

      onComplete: function () {
        const topbarWrapper = document.querySelector(
          '.swagger-ui .topbar .topbar-wrapper'
        );

        if (topbarWrapper && !document.querySelector('.cfx-brand')) {
          const brand = document.createElement('div');
          brand.className = 'cfx-brand';

          const logo = document.createElement('img');
          logo.src = './cloudyflex-logo.png';
          logo.alt = 'Cloudyflex';
          logo.className = 'cfx-logo';

          const title = document.createElement('div');
          title.className = 'cfx-title';
          title.textContent = 'CFX API Portal';

          brand.appendChild(logo);
          brand.appendChild(title);

          topbarWrapper.prepend(brand);
        }
      }
    });
  };
</script>

</body>
</html>
