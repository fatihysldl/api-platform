name: Deploy Swagger Developer Portal

on:
  push:
    branches:
      - main
    paths:
      - 'openapi/**'
      - 'zoho/crm/**'
      - 'swagger/**'
      - 'scripts/generate-swagger-config.mjs'
      - '.github/workflows/swagger-pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Swagger configuration
        run: npm run swagger:config

      - name: Build Swagger portal
        run: |
          mkdir -p dist/specs/internal
          mkdir -p dist/specs/zoho

          cp swagger/index.html dist/index.html
          cp swagger/cloudyflex-logo.png dist/cloudyflex-logo.png
          cp swagger/swagger-config.json dist/swagger-config.json
          cp openapi/openapi.yaml dist/specs/internal/openapi.yaml
          cp zoho/crm/v8.0/*.json dist/specs/zoho/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
