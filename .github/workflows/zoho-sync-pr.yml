name: Sync Zoho CRM OAS

on:
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync official Zoho CRM OAS
        run: npm run sync:zoho

      - name: Validate Zoho CRM OAS
        run: npm run validate:zoho

      - name: Rebuild Swagger catalog
        run: npm run swagger:config

      - name: Rebuild Postman collections
        run: npm run postman

      - name: Upload Postman collections
        uses: actions/upload-artifact@v4
        with:
          name: zoho-crm-postman-collections
          path: generated/postman/
          retention-days: 30

      - name: Open update pull request when Zoho changes
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/zoho-crm-oas-sync
          delete-branch: true
          commit-message: 'chore: sync Zoho CRM v8 OAS'
          title: 'chore: sync Zoho CRM v8 OAS'
          body: |
            Automated synchronization from the official Zoho CRM OpenAPI repository.

            Source: https://github.com/zoho/crm-oas

            This pull request contains changes detected in the official
            Zoho CRM v8 OpenAPI Specification.

            The generated Postman collections are available as
            GitHub Actions workflow artifacts.

          add-paths: |
            zoho/crm/**
            swagger/swagger-config.json
